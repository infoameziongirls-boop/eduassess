services:
  - type: web
    name: eduassess
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: EDUASSESS_MIGRATION_MODE=1 python -m flask --app app db upgrade
    startCommand: python startup.py && gunicorn app:app --config gunicorn.conf.py
    disk:
      name: eduassess-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eduassess-db
          property: connectionString
      - key: PERSISTENT_DIR
        value: /opt/render/project/src/instance

databases:
  - name: eduassess-db
    plan: free
